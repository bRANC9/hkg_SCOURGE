# SCOURGE_CONNMAN_NODEVICE=1
# Keep ConnMan away from the telematics modem interfaces and the Orange Pi
# ECM link.  The vendor unit already excludes rmnet_usb1..7 and ncm0;
# rmnet_usb0 carries the primary BlueLink/nav data route and must not be
# reconfigured by ConnMan when Wifi1b owns wlan0.  usb0 is the Pi's static
# 10.55.0.2/24 management link, configured by wifi1b_daemon; ConnMan must
# leave it alone so it cannot overwrite that address or add a default route.
[Service]
ExecStart=
ExecStart=/usr/sbin/connmand -n --nodnsproxy --nobacktrace --nodevice=rmnet_usb0,rmnet_usb1,rmnet_usb2,rmnet_usb3,rmnet_usb4,rmnet_usb5,rmnet_usb6,rmnet_usb7,wwan0,usb0,dbg0,dbg1,dbg2,can0,eth1,eth2,ncmF0,usb1,eth0,tem0,br0,br0:0,ncm0
